name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify npm authentication
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare release version
        id: version
        shell: bash
        run: |
          current_version=$(node -p "require('./package.json').version")
          published_version=$(npm view flowlane version --registry=https://registry.npmjs.org 2>/dev/null || true)

          if [ -z "$published_version" ] || [ "$current_version" = "$published_version" ]; then
            npm version patch --no-git-tag-version
          else
            # Recover a version bump that was committed before a previous publish failed.
            echo "Publishing existing unpublished version $current_version (npm latest is $published_version)."
          fi

          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing flowlane@$version"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Persist release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
            git push
          else
            echo "Release version was already committed."
          fi
